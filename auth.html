<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B3121F" />
  <title>Sign in | Pathfinder Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth">
  <i class="tri t1"></i><i class="tri t2"></i><i class="tri t3"></i>

  <a class="auth-back" href="index.html" id="backToLanding">← Back to home</a>
  <div class="auth-return-loader" id="authReturnLoader" aria-hidden="true"><div class="auth-loader-compass">✦</div><strong>Returning to your trail…</strong><div class="auth-loader-line"><span></span></div></div>
  <div class="auth-wrap">
    <aside class="auth-side">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 2 22 20H2z" fill="#FFC20E"/><circle cx="12" cy="14" r="3" fill="#B3121F"/></svg>
        <span>Pathfinders</span>
      </a>
      <h1>Your trail starts here.</h1>
      <p>Sign in to see your club, honors, and events.</p>
    </aside>

    <section class="card" id="card" data-tab="login">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab" aria-selected="true">Sign in</button>
        <button class="tab" data-tab="register" role="tab" aria-selected="false">Create account</button>
        <span class="pill"></span>
      </div>

      <p id="msg" class="msg" role="alert"></p>

      <div class="forms">
        <!-- LOGIN -->
        <form id="loginForm" class="form" novalidate>
          <div class="field"><input id="loginEmail" type="email" placeholder=" " autocomplete="email" required /><label for="loginEmail">Email</label></div>
          <div class="field"><input id="loginPass" type="password" placeholder=" " autocomplete="current-password" required /><label for="loginPass">Password</label><button type="button" class="eye">Show</button></div>
          <button type="button" id="forgot" class="link">Forgot password?</button>
          <button type="submit" class="btn btn-red"><span>Sign in</span></button>
          <p class="switch">New here? <button type="button" class="link" data-tab="register">Create an account</button></p>
        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="form" novalidate>
          <div class="field"><input id="regName" type="text" placeholder=" " autocomplete="name" required /><label for="regName">Full name</label></div>
          <div class="field"><input id="regClub" type="text" placeholder=" " /><label for="regClub">Club name (optional)</label></div>
          <div class="field"><input id="regEmail" type="email" placeholder=" " autocomplete="email" required /><label for="regEmail">Email</label></div>
          <div class="field"><input id="regPass" type="password" placeholder=" " autocomplete="new-password" minlength="6" required /><label for="regPass">Password</label><button type="button" class="eye">Show</button></div>
          <div class="field"><input id="regPass2" type="password" placeholder=" " autocomplete="new-password" required /><label for="regPass2">Confirm password</label><button type="button" class="eye">Show</button></div>
          <button type="submit" class="btn btn-red"><span>Create account</span></button>
          <p class="switch">Already a member? <button type="button" class="link" data-tab="login">Sign in</button></p>
        </form>
      </div>
    </section>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
