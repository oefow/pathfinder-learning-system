<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B3121F" />
  <title>Dashboard | Pathfinders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dash">
  <aside class="side">
    <div class="side-in">
      <div class="side-head">
        <a class="brand" href="#/home">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 2 22 20H2z" fill="#FFC20E"/><circle cx="12" cy="14" r="3" fill="#B3121F"/></svg>
          <span>Pathfinders</span>
        </a>
        <button id="collapse" class="icon-btn" aria-label="Minimize sidebar" title="Minimize sidebar">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
        </button>
      </div>
      <nav id="sideNav" class="menu"></nav>
      <div class="side-foot">
        <span class="av" id="avSide"></span>
        <div><b id="meName"></b><small id="meMail"></small></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button id="burger" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <strong id="topTitle">Home</strong>
      <span class="av" id="avTop"></span>
    </header>
    <main id="view" class="content"></main>
  </div>

  <nav id="bottomNav" class="bottom menu"></nav>
  <div id="achievementToasts" class="achievement-toasts" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
